name: Job agent

on:
  schedule:
    - cron: "45 3 * * *"   # 07:45 Dubai, after both feeds have refreshed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no AI call, no email)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: job-agent

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "Secrets missing or dry run requested -> dry run"
            python -m agent.main --dry-run
          else
            python -m agent.main
          fi

      - name: Save sent-jobs memory
        run: |
          git config user.name "job-agent-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Update sent jobs $(date -u +%F)" && git push)
